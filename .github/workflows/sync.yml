# .github/workflows/sync.yml
name: Sincronización de Datos (Google Sheets -> Gist)

on:
  schedule:
    # 1. Sincronización normal (cada 15 minutos), excluyendo las horas UTC 21, 22, 23, 00, y 01.
    - cron: '*/15 2-20 * * *'
    # 2. Sincronización intensiva (cada 5 minutos), de 21:00 UTC a 01:55 UTC (equivale a 18:00 a 22:55 GMT-3).
    - cron: '*/5 21-23,0-1 * * *'
  # Permite ejecutarlo manualmente desde la interfaz de GitHub
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    
    # Define el entorno R para el script
    container: rocker/tidyverse:latest 

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Instalar paquetes R
      run: |
        R -e 'install.packages(c("googlesheets4", "dplyr", "tidyr", "readr", "httr2"), repos = "https://cloud.r-project.org/")'
      shell: bash

    - name: Ejecutar el script de sincronización
      env:
        # Variables de entorno inyectadas desde los Secrets (paso 3)
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: Rscript data_sync_script.R
