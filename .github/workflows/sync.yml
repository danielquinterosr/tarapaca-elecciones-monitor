# .github/workflows/sync.yml
name: Sincronización de Datos (Google Sheets -> Gist)

on:
  # Ejecuta el script cada 5 minutos
  schedule:
    - cron: '*/5 * * * *'
  # Permite ejecutarlo manualmente desde la interfaz de GitHub
  workflow_dispatch:

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    
    # Define el entorno R para el script
    container: rocker/tidyverse:latest 

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4
      
    - name: Instalar paquetes R
      run: |
        R -e 'install.packages(c("googlesheets4", "dplyr", "tidyr", "readr", "httr2"), repos = "https://cloud.r-project.org/")'
      shell: bash

    - name: Ejecutar el script de sincronización
      env:
        # Variables de entorno inyectadas desde los Secrets (paso 3)
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: Rscript data_sync_script.R
